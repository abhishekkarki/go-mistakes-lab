version: "2"

linters:
  enable:
    - bodyclose     # #79 unclosed HTTP bodies
    - contextcheck  # #60-61 context propagation
    - errorlint     # #50-51 errors.Is / errors.As
    - gocritic
    - prealloc      # #21 slice preallocation
    - unparam
    # Day 35: add revive and godot
  settings:
    govet:
      enable-all: true   # includes shadow (#1) and copylocks (#74)
      disable:
        - fieldalignment # turn on at Day 28 (#94)
  exclusions:
    rules:
      # Lab code demonstrates mistakes on purpose; only lint it lightly.
      - path: ^lab/
        linters:
          - gocritic
          - prealloc
          - unparam
